<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div>
        <h1 class="text-5xl font-semibold underline text-orange-500 text-center font-serif m-5">Book Library Search</h1>
        
        <div class="flex flex-row items-center justify-center w-full gap-3">
            <input type="text" id="inputbox" class="w-1/3 h-12 m-5 p-4 border-2 border-blue-500 rounded-lg" placeholder="Search Books and Authors" />
            <button id="searchBtn" class="h-12 px-6 bg-green-500 text-white border-2 border-black rounded-lg">Search</button>
        </div>
        <div id="booklist" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 m-4 md:m-8 lg:m-10">
            
        </div>
    
    </div>




    <script src="script.js"></script>
</body>
</html>
